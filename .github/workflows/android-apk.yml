name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify required application files
        run: |
          test -f android-app/src/main/java/com/anjambede/planner/MainActivity.java
          test -f android-app/src/main/java/com/anjambede/planner/AlarmScheduler.java
          test -f android-app/src/main/assets/index.html
          test -f android-app/src/main/assets/app.js
          test -f android-app/src/main/assets/styles.css
          test -f android-app/src/main/res/drawable-nodpi/launcher_logo.png
      - name: Build debug APK
        run: gradle :android-app:assembleDebug --stacktrace
      - name: Verify packaged WebView interface
        run: unzip -l android-app/build/outputs/apk/debug/android-app-debug.apk | grep -q "assets/index.html"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anjam-bede-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.1 --cleanup-tag --yes || true
          gh release create v1.0.1 android-app/build/outputs/apk/debug/android-app-debug.apk#Anjam-Bede.apk --target "$GITHUB_SHA" --title "انجام بده ۱.۰.۱" --notes "نسخهٔ اصلاح‌شده و آمادهٔ نصب برنامهٔ انجام بده"
